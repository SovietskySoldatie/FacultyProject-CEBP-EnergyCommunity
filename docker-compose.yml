version: '3.8'

services:
  postgres-core:
    image: postgres:15
    container_name: postgres-core
    environment:
      POSTGRES_USER: energy_user
      POSTGRES_PASSWORD: energy_password
      POSTGRES_DB: energy_core_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy_user -d energy_core_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
