spring.application.name=core-energy-service
server.port=8080

# PostgreSQL Database Configuration (matches docker-compose.yml)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/energy_core_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:energy_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:energy_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
